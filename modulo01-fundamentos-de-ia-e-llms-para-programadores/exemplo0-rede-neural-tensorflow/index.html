<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rede Neural - Previsão de categoria</title>
<!-- Ensina o navegador a resolver o "@tensorflow/tfjs" que o index.js importa -->
<script type="importmap">
{ "imports": { "@tensorflow/tfjs": "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/+esm" } }
</script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2430; --muted:#6b7280; --accent:#4f46e5; --border:#d9dce3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161c; --card:#1d2029; --text:#e8eaf0; --muted:#9aa1b0; --accent:#818cf8; --border:#343846; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:1.4rem; margin:0; }
  h2 { font-size:1.05rem; margin:0 0 12px; }
  p.hint { color:var(--muted); margin:0; font-size:.9rem; }
  section { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:.8rem; color:var(--muted); font-weight:600; padding:0 6px 6px; }
  td { padding:3px 6px; }
  input, select { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  button { padding:7px 14px; border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button.x { background:transparent; color:var(--muted); border-color:transparent; padding:4px 8px; }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .row > label { flex:1 1 130px; font-size:.8rem; color:var(--muted); }
  .scroll { overflow-x:auto; }
  .bar { display:grid; grid-template-columns:90px 1fr 70px; gap:10px; align-items:center; margin:6px 0; }
  .track { background:var(--bg); border-radius:6px; height:16px; overflow:hidden; border:1px solid var(--border); }
  .fill { height:100%; background:var(--accent); width:0; transition:width .3s; }
  #status { color:var(--muted); font-size:.9rem; margin-top:10px; min-height:1.4em; }
</style>
</head>
<body>
<main>
  <h1>Previsão de categoria com rede neural</h1>

  <section>
    <h2>1. Dados de treino</h2>
    <p class="hint" style="margin-bottom:10px">Edite, remova ou adicione pessoas. Cada uma precisa de uma categoria (a resposta certa).</p>
    <div class="scroll">
      <table>
        <thead><tr><th>Nome</th><th>Idade</th><th>Cor</th><th>Localização</th><th>Categoria</th><th></th></tr></thead>
        <tbody id="treino"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="ghost" id="add">+ Adicionar pessoa</button>
      <label style="max-width:140px">Épocas
        <input type="number" id="epochs" value="100" min="1" max="2000">
      </label>
      <button id="treinar">Treinar modelo</button>
    </div>
    <div id="status"></div>
  </section>

  <section>
    <h2>2. Pessoa para prever</h2>
    <div class="row">
      <label>Idade <input type="number" id="p-idade" value="28" min="0" max="120"></label>
      <label>Cor
        <select id="p-cor"></select>
      </label>
      <label>Localização
        <select id="p-loc"></select>
      </label>
      <button id="prever" disabled>Prever</button>
    </div>
    <div id="resultado" style="margin-top:14px"></div>
  </section>
</main>

<script type="module">
import * as tf from '@tensorflow/tfjs';
import { trainModel, predict } from './index.js';

const CORES = ['azul', 'vermelho', 'verde'];
const LOCAIS = ['São Paulo', 'Rio', 'Curitiba'];
const CATEGORIAS = ['premium', 'medium', 'basic']; // ordem do one-hot

const $ = id => document.getElementById(id);
const opts = lista => lista.map(v => `<option>${v}</option>`).join('');
$('p-cor').innerHTML = opts(CORES);
$('p-loc').innerHTML = opts(LOCAIS);

let model = null;
let idadeMin = 0, idadeMax = 1; // usados na normalização, definidos no treino

function addLinha(p = { nome:'', idade:30, cor:'azul', loc:'São Paulo', cat:'premium' }) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="nome" value="${p.nome}"></td>
    <td><input class="idade" type="number" min="0" max="120" value="${p.idade}"></td>
    <td><select class="cor">${opts(CORES)}</select></td>
    <td><select class="loc">${opts(LOCAIS)}</select></td>
    <td><select class="cat">${opts(CATEGORIAS)}</select></td>
    <td><button class="x" title="Remover">✕</button></td>`;
  tr.querySelector('.cor').value = p.cor;
  tr.querySelector('.loc').value = p.loc;
  tr.querySelector('.cat').value = p.cat;
  tr.querySelector('.x').onclick = () => tr.remove();
  $('treino').appendChild(tr);
}

// Mesmos dados do index.js
[
  { nome:'Erick',  idade:30, cor:'azul',     loc:'São Paulo', cat:'premium' },
  { nome:'Ana',    idade:25, cor:'vermelho', loc:'Rio',       cat:'medium' },
  { nome:'Carlos', idade:40, cor:'verde',    loc:'Curitiba',  cat:'basic' },
].forEach(addLinha);
$('add').onclick = () => addLinha();

const oneHot = (lista, valor) => lista.map(v => (v === valor ? 1 : 0));
const normalizaIdade = i => (idadeMax === idadeMin ? 0 : (i - idadeMin) / (idadeMax - idadeMin));
const vetor = (idade, cor, loc) => [normalizaIdade(idade), ...oneHot(CORES, cor), ...oneHot(LOCAIS, loc)];

function lerTreino() {
  return [...$('treino').rows].map(tr => ({
    idade: Number(tr.querySelector('.idade').value),
    cor: tr.querySelector('.cor').value,
    loc: tr.querySelector('.loc').value,
    cat: tr.querySelector('.cat').value,
  }));
}

async function treinar() {
  const dados = lerTreino();
  if (dados.length < 2) { $('status').textContent = 'Adicione pelo menos 2 pessoas.'; return; }

  const idades = dados.map(d => d.idade);
  idadeMin = Math.min(...idades);
  idadeMax = Math.max(...idades);

  const xs = tf.tensor2d(dados.map(d => vetor(d.idade, d.cor, d.loc)));
  const ys = tf.tensor2d(dados.map(d => oneHot(CATEGORIAS, d.cat)));

  if (model) model.dispose();

  const epochs = Number($('epochs').value) || 100;
  $('treinar').disabled = true;
  $('prever').disabled = true;
  let ultimoLog = {};
  // trainModel vem do index.js
  model = await trainModel(xs, ys, {
    epochs,
    onEpochEnd: async (e, log) => {
      ultimoLog = log;
      $('status').textContent = `Época ${e + 1}/${epochs} · loss ${log.loss.toFixed(4)}`;
      if (e % 10 === 0) await tf.nextFrame(); // deixa a página atualizar
    }
  });
  xs.dispose(); ys.dispose();

  const acc = ultimoLog.acc ?? ultimoLog.accuracy;
  $('status').textContent = `Treino concluído (${dados.length} pessoas, ${epochs} épocas) · loss ${ultimoLog.loss.toFixed(4)} · acurácia ${(acc * 100).toFixed(0)}%`;
  $('treinar').disabled = false;
  $('prever').disabled = false;
  $('resultado').innerHTML = '';
}

async function prever() {
  const idade = Number($('p-idade').value);
  // predict vem do index.js e devolve [{ prob, index }, ...]
  const previsoes = await predict(model, [vetor(idade, $('p-cor').value, $('p-loc').value)]);

  $('resultado').innerHTML = previsoes
    .map(({ prob, index }) => ({ prob, nome: CATEGORIAS[index] }))
    .sort((a, b) => b.prob - a.prob)
    .map(r => `<div class="bar"><strong>${r.nome}</strong>
      <div class="track"><div class="fill" style="width:${(r.prob * 100).toFixed(1)}%"></div></div>
      <span>${(r.prob * 100).toFixed(2)}%</span></div>`)
    .join('');
}

$('treinar').onclick = treinar;
$('prever').onclick = prever;
</script>
</body>
</html>
